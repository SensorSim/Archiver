name: docker-build

on:
  push:
    branches: [ "main" ]

defaults:
  run:
    working-directory: Archiver

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t archiver:ci -f Dockerfile .
